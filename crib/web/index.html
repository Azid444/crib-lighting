<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crib</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="/static/manifest.json">
<style>
  :root{
    --bg:#0a0a0f; --card:#16161f; --line:#26262f;
    --text:#f2f2f7; --dim:#8a8a99; --accent:#7c5cff;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding:max(env(safe-area-inset-top),16px) 16px calc(24px + var(--safe-b));
    -webkit-user-select:none;user-select:none;
  }
  h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;
     color:var(--dim);margin:26px 0 10px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  button{
    font:inherit;color:var(--text);background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:16px;
    min-height:56px;cursor:pointer;transition:transform .08s,background .15s;
  }
  button:active{transform:scale(.97);background:#20202c}
  button[aria-pressed="true"]{border-color:var(--accent);background:#221b45}
  .rave{
    grid-column:1/-1;min-height:84px;font-size:22px;font-weight:700;
    letter-spacing:.04em;border:none;
    background:linear-gradient(100deg,#ff2d55,#7c5cff,#00d4ff,#ff2d55);
    background-size:300% 100%;
  }
  .rave[aria-pressed="true"]{animation:slide 1.4s linear infinite}
  @keyframes slide{to{background-position:-300% 0}}
  .light{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:10px;
  }
  .row{display:flex;align-items:center;gap:12px}
  .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
  .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .off{opacity:.35}
  .toggle{min-height:40px;padding:8px 18px;border-radius:20px;font-size:14px}
  input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--accent);height:28px}
  input[type=color]{
    width:44px;height:36px;padding:0;border:1px solid var(--line);
    border-radius:10px;background:none;flex:none;
  }
  .err{background:#3a1520;border:1px solid #6b2436;border-radius:12px;
       padding:12px;margin-bottom:12px;font-size:14px;display:none}
</style>
</head>
<body>
  <h1>Crib</h1>
  <div class="sub" id="sub">connecting…</div>
  <div class="err" id="err"></div>

  <h2>Scenes</h2>
  <div class="grid" id="scenes"></div>

  <h2>Effects</h2>
  <div class="grid" id="effects">
    <button class="rave" id="rave" aria-pressed="false">RAVE</button>
  </div>

  <h2>Lights</h2>
  <div id="lights"></div>

<script>
const $ = s => document.querySelector(s);
let state = null, busy = false;

const hex = ([r,g,b]) => '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
const rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));

async function api(path, opts={}) {
  try {
    const res = await fetch('/api' + path, {
      headers:{'content-type':'application/json'}, ...opts
    });
    if (!res.ok) throw new Error(await res.text());
    $('#err').style.display = 'none';
    render(await res.json());
  } catch (e) {
    $('#err').textContent = String(e.message || e).slice(0, 200);
    $('#err').style.display = 'block';
  }
}

const post = (p, body) =>
  api(p, {method:'POST', body: body ? JSON.stringify(body) : '{}'});

function render(s) {
  state = s;
  const up = s.lights.filter(l => l.available).length;
  $('#sub').textContent =
    `${up}/${s.lights.length} online` + (s.effect ? ` · ${s.effect}` : '');

  // Scenes
  const sc = $('#scenes');
  if (sc.children.length !== s.scenes.length) {
    sc.innerHTML = '';
    for (const name of s.scenes) {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = () => post('/scene/' + name);
      sc.append(b);
    }
  }

  // Effect buttons (rave lives in the markup; the rest are generated once)
  $('#rave').setAttribute('aria-pressed', s.effect === 'rave');
  if ($('#effects').children.length === 1) {
    for (const name of ['strobe','rainbow','breathe']) {
      const b = document.createElement('button');
      b.textContent = name;
      b.dataset.fx = name;
      b.onclick = () =>
        state.effect === name ? api('/effect', {method:'DELETE'})
                              : post('/effect', {name});
      $('#effects').append(b);
    }
  }
  for (const b of document.querySelectorAll('[data-fx]'))
    b.setAttribute('aria-pressed', s.effect === b.dataset.fx);

  // Lights — rebuilt only when the set changes, so sliders stay draggable
  const box = $('#lights');
  if (box.dataset.ids !== s.lights.map(l => l.id).join()) {
    box.dataset.ids = s.lights.map(l => l.id).join();
    box.innerHTML = '';
    for (const l of s.lights) box.append(lightCard(l));
  }
  for (const l of s.lights) updateCard(l);
}

function lightCard(l) {
  const el = document.createElement('div');
  el.className = 'light';
  el.id = 'l-' + l.id;
  el.innerHTML = `
    <div class="row">
      <span class="dot"></span>
      <span class="nm"></span>
      ${l.caps.color ? '<input type="color">' : ''}
      <button class="toggle"></button>
    </div>
    ${l.caps.brightness ? '<input type="range" min="0" max="255">' : ''}`;

  el.querySelector('.toggle').onclick =
    () => post('/light/' + l.id, {on: !state.lights.find(x => x.id === l.id).on});

  const col = el.querySelector('input[type=color]');
  if (col) col.oninput = () => post('/light/' + l.id, {color: rgb(col.value), on: true});

  const rng = el.querySelector('input[type=range]');
  if (rng) {
    // Guard against the 1s state push snapping the knob back mid-drag.
    rng.onpointerdown = () => busy = true;
    rng.onpointerup = () => busy = false;
    rng.oninput = () => post('/light/' + l.id,
      {brightness: +rng.value, on: +rng.value > 0});
  }
  return el;
}

function updateCard(l) {
  const el = $('#l-' + l.id);
  if (!el) return;
  el.classList.toggle('off', !l.on);
  el.querySelector('.nm').textContent = l.name + (l.available ? '' : ' (offline)');
  el.querySelector('.dot').style.color = l.on ? hex(l.color) : '#3a3a44';
  el.querySelector('.toggle').textContent = l.on ? 'On' : 'Off';
  const col = el.querySelector('input[type=color]');
  if (col && !busy) col.value = hex(l.color);
  const rng = el.querySelector('input[type=range]');
  if (rng && !busy) rng.value = l.brightness;
}

$('#rave').onclick = () =>
  state?.effect === 'rave' ? api('/effect', {method:'DELETE'})
                           : post('/effect', {name:'rave', bpm:128});

// Live state: WebSocket, falling back to polling if it drops.
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = new WebSocket(`${proto}://${location.host}/ws`);
  sock.onmessage = e => { if (!busy) render(JSON.parse(e.data)); };
  sock.onclose = () => setTimeout(connect, 2000);
}
api('/state').then(connect);
</script>
</body>
</html>
