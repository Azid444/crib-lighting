# Copy to config.yaml and fill in your own values.
server:
  host: 0.0.0.0
  port: 8080

devices:
  - id: strip
    name: Desk Strip
    driver: wled
    host: 192.168.1.50        # WLED device IP (set a DHCP reservation for it)

  - id: tv
    name: TV Backlight
    driver: mrstar
    address: "AA:BB:CC:DD:EE:FF"   # run `python -m crib.scan` to find this

  - id: ceiling
    name: Room Lights
    driver: tuya
    device_id: "abcdef1234567890"  # from tinytuya wizard
    address: 192.168.1.60
    local_key: "0123456789abcdef"
    version: 3.3

# Sound-reactive rave (optional). Leave `device` unset to use the default
# input. To react to what the PC is *playing* rather than the room, point this
# at a loopback device -- run `python -m crib.audio` to list them by index.
audio:
  device: null
  sensitivity: 1.35   # lower = more beats detected, higher = only big hits
